# =============================================================================
# pyproject.toml -- Bioacustica Fauna
# PEP 517/518 -- build system + tool configuration
# =============================================================================

[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

# -----------------------------------------------------------------------------
# Project metadata (PEP 621)
# -----------------------------------------------------------------------------
[project]
name            = "bioacustica-fauna"
version         = "0.3.0"
description     = "Bioacustica Fauna: sistema de identificacion de fauna mediante audio e IA"
readme          = "README.md"
license         = { text = "MIT" }
requires-python = ">=3.10"
authors         = [
    { name = "Ian", email = "brianferbaez@gmail.com" },
]
keywords = [
    "bioacustica", "fauna", "bioacoustics", "wildlife", "machine-learning", "deep-learning",
    "species-identification", "passive-acoustic-monitoring",
    "soundscape-ecology", "CNN", "transfer-learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "librosa>=0.10.0",
    "soundfile>=0.12.1",
    "noisereduce>=3.0.0",
    "timm>=0.9.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pandas>=2.1.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.4.0",
    "aiofiles>=23.2.1",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.12.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "plotly>=5.18.0",
    "mlflow>=2.9.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "bandit>=1.7.0",
    "mypy>=1.5.0",
    "pre-commit>=3.5.0",
]
notebooks = [
    "jupyter>=1.0.0",
    "ipywidgets>=8.1.0",
]
export = [
    "onnx>=1.14.0",
    "onnxruntime>=1.16.0",
]

[project.urls]
Homepage      = "https://github.com/ZOMBIECRAFTIAN/bioacustica-fauna"
Repository    = "https://github.com/ZOMBIECRAFTIAN/bioacustica-fauna"
"Bug Tracker" = "https://github.com/ZOMBIECRAFTIAN/bioacustica-fauna/issues"

# -----------------------------------------------------------------------------
# setuptools -- package discovery
# -----------------------------------------------------------------------------
[tool.setuptools.packages.find]
where   = ["."]
include = ["src*", "scripts*"]
exclude = ["tests*", "notebooks*", "docs*", "data*", "models*"]

# -----------------------------------------------------------------------------
# Ruff -- linter + formatter
# https://docs.astral.sh/ruff/
# -----------------------------------------------------------------------------
[tool.ruff]
target-version = "py310"
line-length    = 100
src            = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",   # line too long -- black handles this
    "E402",   # module level import not at top (conditional imports are valid)
    "E741",   # ambiguous variable names (l, O, I -- ok in scientific context)
    "N801",   # class name CapWords (iNaturalistDownloader preserves official name)
    "N803",   # argument name lowercase (scientific matrices: X, Y)
    "N806",   # variable in function lowercase (idem)
    "N812",   # lowercase imported as non-lowercase (torch.nn.functional as F -- convention)
    "B008",   # function calls in default arguments (FastAPI Depends)
    "B904",   # raise from err -- simple re-raise in except clauses
    "B905",   # zip() strict= -- Python 3.9 compatibility
    "B007",   # loop variable unused -- named_parameters() pattern
    "SIM105", # contextlib.suppress -- try/except/pass more readable in cleanup
    "SIM108", # ternary operator -- sometimes reduces readability
    "SIM115", # context manager for open -- log rotation requires persistent open()
    "UP007",  # use X | Y for union types (Python 3.9 compatibility)
    "C408",   # unnecessary dict() -- subplot_kw=dict() is matplotlib convention
    "F841",   # unused variable -- intentional debug/comment variables
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/*"   = ["S101"]   # assert ok in tests
"scripts/*" = ["T201"]   # print() ok in CLI scripts

[tool.ruff.format]
quote-style               = "double"
indent-style              = "space"
skip-magic-trailing-comma = false

# -----------------------------------------------------------------------------
# Black -- formatter
# -----------------------------------------------------------------------------
[tool.black]
line-length    = 100
target-version = ["py310", "py311", "py312"]
extend-exclude = "(\\.venv|__pycache__|\\.mypy_cache|\\.ruff_cache|build|dist)"

# -----------------------------------------------------------------------------
# isort -- import ordering
# profile = "black" -> isort output is compatible with black
# -----------------------------------------------------------------------------
[tool.isort]
profile                   = "black"
line_length               = 100
known_first_party         = ["src"]
known_third_party         = [
    "librosa", "soundfile", "numpy", "scipy", "pandas",
    "torch", "torchvision", "torchaudio", "timm",
    "sklearn", "fastapi", "pydantic", "sqlalchemy",
    "alembic", "mlflow", "matplotlib", "seaborn", "plotly",
    "loguru", "tqdm",
]
skip_glob                 = [".venv/*", "build/*", "dist/*"]

# -----------------------------------------------------------------------------
# pytest
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths        = ["tests"]
python_files     = ["test_*.py"]
python_classes   = ["Test*"]
python_functions = ["test_*"]
addopts          = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=40",
]
markers = [
    "slow: tests lentos (>5s) -- skip with -m 'not slow'",
    "gpu: requires GPU -- skip in CI with -m 'not gpu'",
    "integration: requires external services (DB, API)",
]
filterwarnings = [
    "ignore::DeprecationWarning:librosa",
    "ignore::UserWarning:torch",
]

# -----------------------------------------------------------------------------
# mypy -- type checking
# -----------------------------------------------------------------------------
[tool.mypy]
python_version         = "3.10"
warn_return_any        = true
warn_unused_configs    = true
ignore_missing_imports = true
no_strict_optional     = false
plugins                = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module                 = ["librosa.*", "soundfile.*", "timm.*", "noisereduce.*"]
ignore_missing_imports = true

# -----------------------------------------------------------------------------
# Coverage
# -----------------------------------------------------------------------------
[tool.coverage.run]
source = ["src"]
omit   = [
    "src/api/main.py",
    "src/monitoring/acoustic_monitor.py",
    "**/__pycache__/**",
    "**/.venv/**",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]

# -----------------------------------------------------------------------------
# Bandit -- security lint
# -----------------------------------------------------------------------------
[tool.bandit]
exclude_dirs = ["tests", ".venv", "data", "models"]
skips = [
    "B110",  # cleanup/logging fallback paths intentionally swallow errors
    "B112",  # malformed local JSONL rows are skipped while reading history
    "B311",  # random is used for non-cryptographic ML augmentation only
]
