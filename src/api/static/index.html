<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BioAcoustics Mexico</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef2ee;
      --ink: #14211d;
      --muted: #65736c;
      --panel: #ffffff;
      --panel-2: #f8faf8;
      --line: #d5ded6;
      --accent: #0d7c72;
      --accent-dark: #07564f;
      --gold: #d5a03a;
      --rust: #bf5b2c;
      --sky: #dbeaf2;
      --danger: #a43f3f;
      --shadow: 0 18px 45px rgba(22, 34, 28, .10);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        linear-gradient(180deg, rgba(13, 124, 114, .12), transparent 360px),
        var(--bg);
      color: var(--ink);
    }

    main {
      width: min(1180px, calc(100% - 28px));
      margin: 0 auto;
      padding: 24px 0 42px;
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: end;
      min-height: 96px;
      padding: 10px 0 22px;
    }

    h1 {
      margin: 0;
      font-size: 34px;
      line-height: 1.05;
      letter-spacing: 0;
      font-weight: 780;
    }

    .subtitle {
      margin-top: 8px;
      color: var(--muted);
      font-size: 15px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      min-height: 38px;
      padding: 7px 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,.86);
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
      box-shadow: 0 8px 22px rgba(22, 34, 28, .06);
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--danger);
    }

    .dot.ok { background: var(--accent); }

    .workspace {
      display: grid;
      grid-template-columns: 380px minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    .panel {
      background: rgba(255,255,255,.92);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .panel-body { padding: 16px; }

    .panel-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    h2 {
      margin: 0;
      font-size: 16px;
      line-height: 1.2;
      font-weight: 760;
      letter-spacing: 0;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 680;
    }

    input[type="file"], select, input[type="number"] {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 8px 10px;
      background: #fff;
      color: var(--ink);
      font: inherit;
    }

    .drop {
      display: grid;
      place-items: center;
      min-height: 126px;
      border: 1px dashed #aab8af;
      border-radius: 8px;
      background: linear-gradient(135deg, #fbfdfb, #edf6f3);
      padding: 14px;
      text-align: center;
    }

    .drop input { max-width: 290px; }

    .row {
      display: grid;
      grid-template-columns: 1fr 110px;
      gap: 12px;
    }

    audio {
      width: 100%;
      margin-top: 14px;
    }

    button {
      width: 100%;
      min-height: 44px;
      margin-top: 16px;
      border: 0;
      border-radius: 7px;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: #fff;
      font-weight: 780;
      cursor: pointer;
      box-shadow: 0 10px 22px rgba(13, 124, 114, .20);
    }

    button:disabled {
      cursor: wait;
      opacity: .68;
      box-shadow: none;
    }

    .secondary-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .secondary-actions button,
    .feedback button {
      margin-top: 0;
      background: #fff;
      color: var(--accent-dark);
      border: 1px solid var(--line);
      box-shadow: none;
    }

    .message {
      margin-top: 12px;
      color: var(--muted);
      font-size: 13px;
      min-height: 19px;
      overflow-wrap: anywhere;
    }

    .message.error { color: var(--danger); }

    .spectrogram {
      display: grid;
      gap: 8px;
      margin-top: 18px;
    }

    canvas {
      display: block;
      width: 100%;
      height: 220px;
      border-radius: 8px;
      background: #091816;
      border: 1px solid #17322f;
    }

    .canvas-note {
      color: var(--muted);
      font-size: 12px;
      min-height: 17px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 11px;
      background: var(--panel-2);
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 5px;
    }

    .metric strong {
      font-size: 18px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .empty {
      min-height: 310px;
      display: grid;
      place-items: center;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 8px;
      text-align: center;
      padding: 24px;
      background: #fbfcfb;
    }

    .predictions {
      display: grid;
      gap: 12px;
    }

    .prediction {
      display: grid;
      grid-template-columns: 96px 1fr 82px;
      gap: 14px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      background: #fff;
    }

    .species-photo {
      width: 96px;
      height: 78px;
      border-radius: 7px;
      object-fit: cover;
      background: linear-gradient(135deg, var(--sky), #e8f2da);
    }

    .photo-fallback {
      width: 96px;
      height: 78px;
      display: grid;
      place-items: center;
      border-radius: 7px;
      background: linear-gradient(135deg, var(--sky), #f4e7c2);
      color: var(--accent-dark);
      font-weight: 780;
    }

    .names {
      min-width: 0;
    }

    .common {
      font-size: 17px;
      font-weight: 790;
      overflow-wrap: anywhere;
    }

    .scientific {
      margin-top: 3px;
      color: var(--muted);
      font-style: italic;
      overflow-wrap: anywhere;
    }

    .bar {
      height: 9px;
      margin-top: 9px;
      border-radius: 99px;
      background: #e8ece8;
      overflow: hidden;
    }

    .bar > i {
      display: block;
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--accent), var(--gold), var(--rust));
    }

    .prob {
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-weight: 800;
      color: var(--accent-dark);
    }

    .rank {
      display: inline-grid;
      place-items: center;
      width: 28px;
      height: 28px;
      margin-bottom: 8px;
      border-radius: 50%;
      background: #e6f2ef;
      color: var(--accent);
      font-weight: 800;
    }

    .sources {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 18px;
    }

    .source {
      display: grid;
      gap: 7px;
      min-height: 152px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,.92);
      box-shadow: 0 12px 28px rgba(22, 34, 28, .06);
    }

    .source a {
      color: var(--accent-dark);
      font-weight: 790;
      text-decoration: none;
    }

    .source p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .section-label {
      margin: 22px 0 10px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 760;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .feedback {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .history {
      display: grid;
      gap: 8px;
      margin-top: 18px;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--muted);
      font-size: 13px;
    }

    .history-item strong {
      color: var(--ink);
    }

    @media (max-width: 920px) {
      .workspace { grid-template-columns: 1fr; }
      .sources { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 640px) {
      main { width: min(100% - 20px, 1180px); padding-top: 12px; }
      header { grid-template-columns: 1fr; align-items: start; }
      h1 { font-size: 28px; }
      .row, .summary, .sources { grid-template-columns: 1fr; }
      .prediction { grid-template-columns: 78px 1fr; }
      .species-photo, .photo-fallback { width: 78px; height: 70px; }
      .prob { grid-column: 2; text-align: left; }
      canvas { height: 180px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>BioAcoustics Mexico</h1>
        <div class="subtitle">Identificacion bioacustica para especies de Mexico</div>
      </div>
      <div class="status"><span id="status-dot" class="dot"></span><span id="status-text">Modelo</span></div>
    </header>

    <div class="workspace">
      <section class="panel">
        <div class="panel-body">
          <div class="panel-title">
            <h2>Analisis de audio</h2>
          </div>

          <form id="form">
            <div class="drop">
              <input id="audio-file" name="file" type="file" accept="audio/*,.wav,.mp3,.flac,.ogg,.aif,.aiff" />
            </div>

            <div class="secondary-actions">
              <button id="record-btn" type="button">Grabar 10s</button>
              <button id="location-btn" type="button">Usar ubicacion</button>
            </div>

            <div class="row">
              <div>
                <label for="preset">Preset</label>
                <select id="preset" name="preset">
                  <option value="birds" selected>Aves</option>
                  <option value="mammals">Mamiferos</option>
                  <option value="frogs">Anfibios</option>
                  <option value="reptiles">Reptiles</option>
                  <option value="insects">Insectos</option>
                </select>
              </div>
              <div>
                <label for="top-k">Top K</label>
                <input id="top-k" name="top_k" type="number" min="1" max="10" value="5" />
              </div>
            </div>

            <label for="region">Region</label>
            <select id="region" name="region">
              <option value="Mexico" selected>Mexico completo</option>
              <option value="Aguascalientes">Aguascalientes</option>
              <option value="Baja California">Baja California</option>
              <option value="Baja California Sur">Baja California Sur</option>
              <option value="Campeche">Campeche</option>
              <option value="Chiapas">Chiapas</option>
              <option value="Chihuahua">Chihuahua</option>
              <option value="Ciudad de Mexico">Ciudad de Mexico</option>
              <option value="Coahuila">Coahuila</option>
              <option value="Colima">Colima</option>
              <option value="Durango">Durango</option>
              <option value="Estado de Mexico">Estado de Mexico</option>
              <option value="Guanajuato">Guanajuato</option>
              <option value="Guerrero">Guerrero</option>
              <option value="Hidalgo">Hidalgo</option>
              <option value="Jalisco">Jalisco</option>
              <option value="Michoacan">Michoacan</option>
              <option value="Morelos">Morelos</option>
              <option value="Nayarit">Nayarit</option>
              <option value="Nuevo Leon">Nuevo Leon</option>
              <option value="Oaxaca">Oaxaca</option>
              <option value="Puebla">Puebla</option>
              <option value="Queretaro">Queretaro</option>
              <option value="Quintana Roo">Quintana Roo</option>
              <option value="San Luis Potosi">San Luis Potosi</option>
              <option value="Sinaloa">Sinaloa</option>
              <option value="Sonora">Sonora</option>
              <option value="Tabasco">Tabasco</option>
              <option value="Tamaulipas">Tamaulipas</option>
              <option value="Tlaxcala">Tlaxcala</option>
              <option value="Veracruz">Veracruz</option>
              <option value="Yucatan">Yucatan</option>
              <option value="Zacatecas">Zacatecas</option>
            </select>

            <audio id="player" controls hidden></audio>

            <div class="spectrogram">
              <canvas id="spectrogram" width="640" height="260"></canvas>
              <div id="spectrogram-note" class="canvas-note">Sin audio cargado</div>
            </div>

            <button id="submit" type="submit">Identificar especie</button>
            <div id="message" class="message"></div>
          </form>
        </div>
      </section>

      <section class="panel">
        <div class="panel-body">
          <div class="panel-title">
            <h2>Resultado</h2>
          </div>

          <div id="summary" class="summary" hidden>
            <div class="metric"><span>Duracion</span><strong id="duration">-</strong></div>
            <div class="metric"><span>Segmentos</span><strong id="segments">-</strong></div>
            <div class="metric"><span>Inferencia</span><strong id="inference">-</strong></div>
          </div>

          <div id="results" class="empty">Sin resultados</div>
          <div id="feedback" class="feedback" hidden>
            <button data-verdict="correct" type="button">Correcto</button>
            <button data-verdict="incorrect" type="button">Incorrecto</button>
            <button data-verdict="unsure" type="button">No estoy seguro</button>
          </div>
        </div>
      </section>
    </div>

    <div class="section-label">Historial</div>
    <section id="history" class="history"></section>

    <div class="section-label">APIs para obtener audios</div>
    <section id="sources" class="sources"></section>
  </main>

  <script>
    const form = document.getElementById("form");
    const fileInput = document.getElementById("audio-file");
    const player = document.getElementById("player");
    const submit = document.getElementById("submit");
    const message = document.getElementById("message");
    const results = document.getElementById("results");
    const summary = document.getElementById("summary");
    const statusDot = document.getElementById("status-dot");
    const statusText = document.getElementById("status-text");
    const spectrogram = document.getElementById("spectrogram");
    const spectrogramNote = document.getElementById("spectrogram-note");
    const sources = document.getElementById("sources");
    const recordBtn = document.getElementById("record-btn");
    const locationBtn = document.getElementById("location-btn");
    const feedback = document.getElementById("feedback");
    const history = document.getElementById("history");

    let recordedFile = null;
    let mediaRecorder = null;
    let geoLat = null;
    let geoLng = null;
    let currentRequestId = null;

    const escapeHtml = (value) => String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

    const pct = (value) => `${Math.round(value * 1000) / 10}%`;

    function setMessage(text, isError = false) {
      message.textContent = text;
      message.classList.toggle("error", isError);
    }

    async function loadHealth() {
      try {
        const res = await fetch("/health");
        const data = await res.json();
        statusDot.classList.toggle("ok", Boolean(data.model_loaded));
        statusText.textContent = data.model_loaded ? `Modelo listo · ${data.device}` : "Modelo no cargado";
      } catch {
        statusText.textContent = "API sin respuesta";
      }
    }

    async function loadSources() {
      try {
        const res = await fetch("/api/sources");
        const data = await res.json();
        sources.innerHTML = data.map((src) => `
          <article class="source">
            <a href="${escapeHtml(src.url)}" target="_blank" rel="noreferrer">${escapeHtml(src.name)}</a>
            <p>${escapeHtml(src.coverage)}</p>
            <p>${escapeHtml(src.notes)}</p>
          </article>
        `).join("");
      } catch {
        sources.innerHTML = "";
      }
    }

    async function loadHistory() {
      try {
        const res = await fetch("/api/history?limit=8");
        const data = await res.json();
        if (!data.length) {
          history.innerHTML = `<div class="empty">Todavia no hay identificaciones guardadas</div>`;
          return;
        }
        history.innerHTML = data.map((item) => {
          const top = item.predictions?.[0];
          const name = top?.common_name_es || top?.scientific_name || "Sin resultado";
          const prob = top?.probability ? pct(top.probability) : "-";
          return `
            <div class="history-item">
              <span><strong>${escapeHtml(name)}</strong> · ${escapeHtml(item.region || "Mexico")}</span>
              <span>${prob}</span>
            </div>
          `;
        }).join("");
      } catch {
        history.innerHTML = "";
      }
    }

    async function sendFeedback(verdict) {
      if (!currentRequestId) return;
      try {
        await fetch("/api/feedback", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ request_id: currentRequestId, verdict })
        });
        setMessage("Feedback guardado. Esto servira para mejorar el dataset.");
      } catch {
        setMessage("No se pudo guardar el feedback", true);
      }
    }

    function colorMap(v) {
      const x = Math.max(0, Math.min(1, v));
      const r = Math.floor(8 + 230 * Math.max(0, x - .42) / .58);
      const g = Math.floor(24 + 180 * Math.sin(x * Math.PI));
      const b = Math.floor(28 + 105 * (1 - x));
      return [r, g, b];
    }

    async function renderSpectrogram(file) {
      const ctx = spectrogram.getContext("2d");
      ctx.clearRect(0, 0, spectrogram.width, spectrogram.height);
      ctx.fillStyle = "#091816";
      ctx.fillRect(0, 0, spectrogram.width, spectrogram.height);
      spectrogramNote.textContent = "Calculando espectrograma...";

      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const arrayBuffer = await file.arrayBuffer();
        const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer.slice(0));
        const sr = audioBuffer.sampleRate;
        const raw = audioBuffer.getChannelData(0);
        const maxSamples = Math.min(raw.length, sr * 30);
        const samples = raw.subarray(0, maxSamples);

        const fftSize = 1024;
        const bins = 150;
        const maxCols = 420;
        const cols = Math.max(1, Math.min(maxCols, Math.floor((samples.length - fftSize) / 256)));
        const hop = Math.max(128, Math.floor((samples.length - fftSize) / cols));
        const mags = new Float32Array(cols * bins);
        let maxMag = 0;

        for (let x = 0; x < cols; x++) {
          const start = x * hop;
          for (let k = 0; k < bins; k++) {
            let re = 0;
            let im = 0;
            for (let n = 0; n < fftSize; n += 2) {
              const idx = start + n;
              const w = 0.5 - 0.5 * Math.cos((2 * Math.PI * n) / (fftSize - 1));
              const sample = (samples[idx] || 0) * w;
              const angle = (2 * Math.PI * k * n) / fftSize;
              re += sample * Math.cos(angle);
              im -= sample * Math.sin(angle);
            }
            const mag = Math.log10(1 + Math.sqrt(re * re + im * im));
            mags[x * bins + k] = mag;
            if (mag > maxMag) maxMag = mag;
          }
          if (x % 24 === 0) await new Promise((resolve) => setTimeout(resolve, 0));
        }

        spectrogram.width = cols;
        spectrogram.height = bins;
        const img = ctx.createImageData(cols, bins);
        for (let x = 0; x < cols; x++) {
          for (let k = 0; k < bins; k++) {
            const value = mags[x * bins + k] / Math.max(maxMag, 1e-6);
            const [r, g, b] = colorMap(Math.pow(value, .72));
            const y = bins - 1 - k;
            const p = (y * cols + x) * 4;
            img.data[p] = r;
            img.data[p + 1] = g;
            img.data[p + 2] = b;
            img.data[p + 3] = 255;
          }
        }
        ctx.putImageData(img, 0, 0);
        spectrogramNote.textContent = `${Math.round(samples.length / sr * 10) / 10}s · ${sr} Hz`;
        await audioCtx.close();
      } catch (err) {
        spectrogramNote.textContent = "No se pudo dibujar el espectrograma";
      }
    }

    function renderResults(predictions) {
      if (!predictions.length) {
        results.className = "empty";
        results.textContent = "Sin predicciones sobre el umbral";
        return;
      }

      results.className = "predictions";
      results.innerHTML = predictions.map((p) => {
        const common = p.common_name_es || p.common_name_en || p.scientific_name;
        const photo = p.image_url
          ? `<img class="species-photo" src="${escapeHtml(p.image_url)}" alt="${escapeHtml(common)}" loading="lazy" />`
          : `<div class="photo-fallback">${escapeHtml(String(common).slice(0, 2).toUpperCase())}</div>`;
        const source = p.source_url
          ? `<a href="/species-card/${encodeURIComponent(p.scientific_name)}">${escapeHtml(p.scientific_name)}</a>`
          : `<a href="/species-card/${encodeURIComponent(p.scientific_name)}">${escapeHtml(p.scientific_name)}</a>`;

        return `
          <article class="prediction">
            ${photo}
            <div class="names">
              <span class="rank">${p.rank}</span>
              <div class="common">${escapeHtml(common)}</div>
              <div class="scientific">${source}</div>
              <div class="bar"><i style="width:${Math.max(2, p.probability * 100)}%"></i></div>
            </div>
            <div class="prob">${pct(p.probability)}</div>
          </article>
        `;
      }).join("");
    }

    function activeAudioFile() {
      return recordedFile || fileInput.files[0] || null;
    }

    async function useLocation() {
      if (!navigator.geolocation) {
        setMessage("Tu navegador no soporta geolocalizacion", true);
        return;
      }
      locationBtn.disabled = true;
      locationBtn.textContent = "Ubicando...";
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          geoLat = pos.coords.latitude;
          geoLng = pos.coords.longitude;
          setMessage(`Ubicacion lista: ${geoLat.toFixed(4)}, ${geoLng.toFixed(4)}`);
          locationBtn.disabled = false;
          locationBtn.textContent = "Usar ubicacion";
        },
        () => {
          setMessage("No se pudo obtener ubicacion", true);
          locationBtn.disabled = false;
          locationBtn.textContent = "Usar ubicacion";
        },
        { enableHighAccuracy: false, timeout: 8000 }
      );
    }

    async function recordAudio() {
      if (mediaRecorder?.state === "recording") {
        mediaRecorder.stop();
        return;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const chunks = [];
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = (event) => {
          if (event.data.size > 0) chunks.push(event.data);
        };
        mediaRecorder.onstop = async () => {
          stream.getTracks().forEach((track) => track.stop());
          const blob = new Blob(chunks, { type: mediaRecorder.mimeType || "audio/webm" });
          recordedFile = new File([blob], `grabacion_${Date.now()}.webm`, { type: blob.type });
          player.src = URL.createObjectURL(recordedFile);
          player.hidden = false;
          fileInput.value = "";
          setMessage(recordedFile.name);
          recordBtn.textContent = "Grabar 10s";
          await renderSpectrogram(recordedFile);
        };
        mediaRecorder.start();
        recordBtn.textContent = "Detener";
        setMessage("Grabando...");
        setTimeout(() => {
          if (mediaRecorder?.state === "recording") mediaRecorder.stop();
        }, 10000);
      } catch {
        setMessage("No se pudo acceder al microfono", true);
      }
    }

    fileInput.addEventListener("change", async () => {
      const file = fileInput.files[0];
      if (!file) return;
      recordedFile = null;
      player.src = URL.createObjectURL(file);
      player.hidden = false;
      setMessage(file.name);
      await renderSpectrogram(file);
    });

    recordBtn.addEventListener("click", recordAudio);
    locationBtn.addEventListener("click", useLocation);
    feedback.addEventListener("click", (event) => {
      const verdict = event.target?.dataset?.verdict;
      if (verdict) sendFeedback(verdict);
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const file = activeAudioFile();
      if (!file) {
        setMessage("Carga un archivo o graba audio primero", true);
        return;
      }

      const body = new FormData();
      body.append("file", file);
      body.append("preset", document.getElementById("preset").value);
      body.append("top_k", document.getElementById("top-k").value);
      body.append("region", document.getElementById("region").value);
      if (geoLat !== null) body.append("lat", String(geoLat));
      if (geoLng !== null) body.append("lng", String(geoLng));

      submit.disabled = true;
      submit.textContent = "Procesando...";
      setMessage("");

      try {
        const res = await fetch("/classify", { method: "POST", body });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Error al clasificar");

        document.getElementById("duration").textContent = `${data.duration_s ?? 0}s`;
        document.getElementById("segments").textContent = data.segment_count;
        document.getElementById("inference").textContent = `${data.inference_ms} ms`;
        summary.hidden = false;
        currentRequestId = data.request_id;
        renderResults(data.predictions);
        feedback.hidden = false;
        loadHistory();
      } catch (err) {
        setMessage(err.message || String(err), true);
      } finally {
        submit.disabled = false;
        submit.textContent = "Identificar especie";
      }
    });

    loadHealth();
    loadSources();
    loadHistory();
  </script>
</body>
</html>
