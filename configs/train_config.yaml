# ─────────────────────────────────────────────────────────────────────────────
# Configuración de entrenamiento — BioAcoustics AI
# Ajustar según grupo taxonómico y hardware disponible
# ─────────────────────────────────────────────────────────────────────────────

# ── Dataset ──────────────────────────────────────────────────────────────────
dataset:
  root_dir:       "data/spectrograms"
  target_size:    [128, 128]       # (n_mels, T) — dimensión del espectrograma
  normalize:      true
  train_split:    0.70
  val_split:      0.15
  test_split:     0.15
  split_strategy: "stratified"     # random | stratified | site-based | temporal
  min_samples_per_class: 30        # clases con menos se descartan

# ── Modelo ───────────────────────────────────────────────────────────────────
model:
  type:           "efficientnet"   # cnn_baseline | efficientnet | pannscnn14
  backbone:       "efficientnet_b0"
  in_channels:    1                # 1 = Mel mono, 3 = Mel+chroma+contrast
  dropout:        0.35
  pretrained:     true

# ── Entrenamiento ─────────────────────────────────────────────────────────────
training:
  device:         "auto"           # auto | cpu | cuda | mps
  batch_size:     32
  num_workers:    4
  pin_memory:     true

  # Fine-tuning progresivo
  phase1_epochs:  15               # backbone congelado
  phase2_epochs:  20               # últimos 3 bloques descongelados
  phase3_epochs:  15               # backbone completo

  # Optimizador
  optimizer:      "adamw"
  lr_phase1:      1.0e-3
  lr_phase2:      1.0e-4
  lr_phase3:      5.0e-5
  weight_decay:   1.0e-4

  # Loss
  label_smoothing: 0.1
  use_class_weights: true

  # Regularización
  use_mixup:       true
  mixup_alpha:     0.4
  use_specaugment: true
  freq_mask:       20
  time_mask:       30

  # Early stopping
  patience:        10

# ── Preprocesamiento de audio ──────────────────────────────────────────────────
audio:
  sample_rate:     44100
  segment_s:       3.0
  hop_s:           1.5
  n_fft:           2048
  hop_length:      512
  n_mels:          128
  fmin:            50
  fmax:            null            # null = Nyquist
  apply_bandpass:  true
  apply_nr:        true
  normalize:       true

# ── Salida ────────────────────────────────────────────────────────────────────
output:
  model_dir:       "models/trained"
  results_dir:     "results"
  experiment_name: "bioacustica_fauna_v1"
  log_level:       "INFO"
  save_every_n_epochs: 5

# ── Evaluación ───────────────────────────────────────────────────────────────
evaluation:
  metrics:   ["accuracy", "f1_macro", "precision_macro", "recall_macro", "auc_roc"]
  top_k:     [1, 3, 5]
  min_prob:  0.05
