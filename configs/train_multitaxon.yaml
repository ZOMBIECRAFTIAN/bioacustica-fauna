# Configuracion de entrenamiento -- Tesis Maestria Multitaxon
#
# Objetivo:
#   Experimento piloto para comparar clasificacion plana vs enfoque adaptativo
#   por grupo animal en fauna acusticamente detectable.
#
# Dataset esperado:
#   python -m src.data.dataset_builder --profile mexico_multitaxon --output data/raw/multitaxon
#   python -m src.feature_extraction.batch_extractor --input data/raw/multitaxon --output data/spectrograms/multitaxon --preset adaptive

dataset:
  root_dir:       "data/spectrograms/multitaxon"
  target_size:    [128, 128]
  normalize:      true
  train_split:    0.70
  val_split:      0.15
  test_split:     0.15
  split_strategy: "source_file"   # evita fuga de segmentos del mismo audio entre splits
  manifest_csv:   "data/spectrograms/multitaxon/dataset_manifest.csv"
  label_mode:     "class"         # class | acoustic_group
  random_state:   42
  min_samples_per_class: 5

  # Metadatos de tesis: usados para documentacion/evaluacion externa.
  profile:        "mexico_multitaxon"
  acoustic_groups:
    - frogs
    - bats
    - birds
    - insects
    - mammals
  negative_classes:
    - unknown_biological
    - rain
    - wind
    - human_voice
    - traffic
    - silence
  class_groups:
    # Anuros
    smilisca_baudinii: frogs
    rhinella_horribilis: frogs
    incilius_valliceps: frogs
    lithobates_berlandieri: frogs
    lithobates_forreri: frogs
    eleutherodactylus_cystignathoides: frogs
    exerodonta_smaragdinus: frogs
    craugastor_augusti: frogs
    # Murcielagos
    tadarida_brasiliensis: bats
    myotis_velifer: bats
    eptesicus_fuscus: bats
    nyctinomops_macrotis: bats
    lasiurus_cinereus: bats
    balantiopteryx_plicata: bats
    # Aves comparativas
    quiscalus_mexicanus: birds
    turdus_grayi: birds
    pitangus_sulphuratus: birds
    myiozetetes_similis: birds
    melanerpes_aurifrons: birds
    campylorhynchus_brunneicapillus: birds
    # Insectos y mamiferos vocales
    gryllus_assimilis: insects
    neoconocephalus_triops: insects
    oecanthus_niveus: insects
    alouatta_palliata: mammals
    canis_latrans: mammals
    procyon_lotor: mammals
    # Negativas / rechazo
    unknown_biological: negative
    rain: negative
    wind: negative
    human_voice: negative
    traffic: negative
    silence: negative

model:
  type:           "efficientnet"
  backbone:       "efficientnet_b0"
  in_channels:    1
  dropout:        0.40
  pretrained:     true

training:
  device:         "auto"
  batch_size:     24
  num_workers:    4
  pin_memory:     true

  # Fases cortas para piloto de maestria. Aumentar cuando el dataset este cerrado.
  phase1_epochs:  8
  phase2_epochs:  12
  phase3_epochs:  8

  optimizer:      "adamw"
  lr_phase1:      8.0e-4
  lr_phase2:      1.0e-4
  lr_phase3:      3.0e-5
  weight_decay:   1.0e-4

  label_smoothing: 0.1
  use_class_weights: true

  use_mixup:       true
  mixup_alpha:     0.25
  use_specaugment: true
  freq_mask:       16
  time_mask:       24

  patience:        8

audio:
  # Configuracion comun para espectrogramas comparables.
  # El experimento adaptativo debe generar features por grupo usando presets
  # especificos antes de normalizar a target_size.
  sample_rate:     44100
  segment_s:       3.0
  hop_s:           1.5
  n_fft:           2048
  hop_length:      512
  n_mels:          128
  fmin:            50
  fmax:            null
  apply_bandpass:  true
  apply_nr:        true
  normalize:       true
  preset:          "adaptive"

adaptive_presets:
  frogs:   "frogs"
  bats:    "bats"
  birds:   "birds"
  insects: "insects"
  mammals: "mammals"
  unknown: "default"
  noise:   "default"

hierarchical:
  enabled: true
  stage1_task: "acoustic_group"
  stage2_task: "species_or_class"
  unknown_threshold: 0.35
  stage1_config: "configs/train_multitaxon_stage1_group.yaml"
  stage2_filter_key: "include_groups"

external_validation:
  enabled: true
  protocol: "docs/metodologia/validacion_campo.md"
  field_audio_dir: "data/field_validation/multitaxon"
  expected_manifest: "data/field_validation/multitaxon/field_manifest.csv"
  min_recordings: 10
  recommended_recordings: 30

output:
  model_dir:       "models/trained/multitaxon"
  results_dir:     "results/maestria_multitaxon"
  experiment_name: "maestria_multitaxon_v1"
  log_level:       "INFO"
  save_every_n_epochs: 5

evaluation:
  metrics:
    - accuracy
    - f1_macro
    - precision_macro
    - recall_macro
    - top_k
  top_k:     [1, 3, 5]
  min_prob:  0.05
  group_metrics: true
  confusion_by_group: true
  report_unknown_rate: true
