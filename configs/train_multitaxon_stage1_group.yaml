# Entrenamiento jerarquico etapa 1 -- clasificacion de grupo acustico.
#
# Requiere dataset_manifest.csv generado por batch_extractor --preset adaptive.
# Etiquetas esperadas: frogs, bats, birds, insects, mammals, negative/unknown.

dataset:
  root_dir:       "data/spectrograms/multitaxon"
  target_size:    [128, 128]
  normalize:      true
  train_split:    0.70
  val_split:      0.15
  test_split:     0.15
  split_strategy: "source_file"
  manifest_csv:   "data/spectrograms/multitaxon/dataset_manifest.csv"
  label_mode:     "acoustic_group"
  random_state:   42
  min_samples_per_class: 5
  negative_classes:
    - unknown_biological
    - rain
    - wind
    - human_voice
    - traffic
    - silence

model:
  type:           "efficientnet"
  backbone:       "efficientnet_b0"
  in_channels:    1
  dropout:        0.35
  pretrained:     true

training:
  device:         "auto"
  batch_size:     24
  num_workers:    4
  pin_memory:     true
  phase1_epochs:  6
  phase2_epochs:  8
  phase3_epochs:  6
  optimizer:      "adamw"
  lr_phase1:      8.0e-4
  lr_phase2:      1.0e-4
  lr_phase3:      3.0e-5
  weight_decay:   1.0e-4
  label_smoothing: 0.1
  use_class_weights: true
  use_mixup:       true
  mixup_alpha:     0.2
  use_specaugment: true
  freq_mask:       12
  time_mask:       20
  patience:        6

audio:
  sample_rate:     44100
  segment_s:       3.0
  hop_s:           1.5
  n_fft:           2048
  hop_length:      512
  n_mels:          128
  fmin:            50
  fmax:            null
  apply_bandpass:  true
  apply_nr:        true
  normalize:       true
  preset:          "adaptive"

output:
  model_dir:       "models/trained/multitaxon_stage1_group"
  results_dir:     "results/maestria_multitaxon/stage1_group"
  experiment_name: "maestria_multitaxon_stage1_group_v1"
  log_level:       "INFO"
  save_every_n_epochs: 5

evaluation:
  metrics:
    - accuracy
    - f1_macro
    - precision_macro
    - recall_macro
    - top_k
  top_k:     [1, 3]
  min_prob:  0.05
  group_metrics: true
  confusion_by_group: true
  report_unknown_rate: true
